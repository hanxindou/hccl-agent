name: Linux CPU_SIM Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-cpu-sim:
    runs-on: ubuntu-22.04
    env:
      DEEPSEEK_API_KEY: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          set-safe-directory: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake

      - name: Validate Linux CPU_SIM
        run: bash scripts/validate_linux_cpu_sim.sh /tmp/hccl-agent-linux-review
