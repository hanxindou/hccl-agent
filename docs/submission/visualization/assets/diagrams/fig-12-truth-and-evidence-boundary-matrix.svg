<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Truth and evidence boundary matrix</title>
  <desc id="desc">Truth and evidence boundary matrix. Give reviewers a compact host/simulator/readiness/real-device map. Truth: HOST_EXECUTED, SIMULATED_ONLY, DIRECT_READINESS_ONLY, REAL_DEVICE_NOT_EXECUTED. Limits: summary does not replace claim ledger. Classification: MAIN.</desc>
  <defs>
    <style>text{font-family:Arial,'Noto Sans',sans-serif;fill:#152238}.title{font-size:34px;font-weight:700}.sub{font-size:17px;fill:#53657a}.label{font-size:16px}.small{font-size:13px;fill:#53657a}.value{font-size:15px;font-weight:700}.node{fill:#f6f8fb;stroke:#9aabc0;stroke-width:2}.primary{fill:#1769aa}.secondary{fill:#3da58a}.warning{fill:#d9852b}.blocked{fill:#c74c4c}.grid{stroke:#d8e0ea;stroke-width:1}.arrow{stroke:#63768c;stroke-width:2;fill:none}.badge{fill:#e8eef5;stroke:#b9c7d7}.badgeText{font-size:12px;font-weight:700}</style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63768c"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="0" y="0" width="14" height="720" fill="#1769aa"/>
  <text class="title" x="54" y="64">Truth and evidence boundary matrix</text>
  <text class="sub" x="54" y="94">Evidence-derived · offline deterministic SVG</text>
  <rect class="badge" x="54" y="112" width="680" height="28" rx="14"/>
  <text class="badgeText" x="70" y="131">HOST_EXECUTED · SIMULATED_ONLY · DIRECT_READINESS_ONLY · REAL_DEVICE_NOT_EXECUTED</text>
  <rect class="node" x="72" y="280" width="245" height="140" rx="14"/>
  <text class="label" x="194.5" y="330" text-anchor="middle" fill="#152238">Host executed</text>
  <line class="arrow" x1="321" y1="350" x2="347" y2="350" marker-end="url(#arrow)"/>
  <rect class="node" x="355" y="280" width="245" height="140" rx="14"/>
  <text class="label" x="477.5" y="330" text-anchor="middle" fill="#152238">Simulator modeled</text>
  <line class="arrow" x1="604" y1="350" x2="630" y2="350" marker-end="url(#arrow)"/>
  <rect class="node" x="638" y="280" width="245" height="140" rx="14"/>
  <text class="label" x="760.5" y="330" text-anchor="middle" fill="#152238">Direct readiness</text>
  <line class="arrow" x1="887" y1="350" x2="913" y2="350" marker-end="url(#arrow)"/>
  <rect class="node" x="921" y="280" width="245" height="140" rx="14"/>
  <text class="label" x="1043.5" y="330" text-anchor="middle" fill="#152238">Real device not</text>
  <text class="label" x="1043.5" y="354" text-anchor="middle" fill="#152238">executed</text>
  <line class="grid" x1="54" y1="665" x2="1226" y2="665"/>
  <text class="small" x="54" y="691">Source: docs/submission/report_chart_data/claim_boundary_summary.json</text>
</svg>
