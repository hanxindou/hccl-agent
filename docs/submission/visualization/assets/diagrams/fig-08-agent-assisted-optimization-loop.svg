<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Agent-assisted optimization loop</title>
  <desc id="desc">Agent-assisted optimization loop. Show proposal, deterministic evaluation, human governance, reflection/replanning, and evidence mapping. Truth: AGENT_GENERATED, DETERMINISTIC_EVALUATION, HUMAN_INTERVENTION, RECONSTRUCTED_FROM_FROZEN_EVIDENCE. Limits: normalized reconstruction is not hidden reasoning or original historical execution. Classification: MAIN.</desc>
