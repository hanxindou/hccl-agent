  <text class="label" x="721.5" y="330" text-anchor="middle" fill="#152238">CPU_SIM + simulator</text>
  <line class="arrow" x1="808" y1="350" x2="826" y2="350" marker-end="url(#arrow)"/>
  <rect class="node" x="834" y="280" width="165" height="140" rx="14"/>
  <text class="label" x="916.5" y="330" text-anchor="middle" fill="#152238">Direct readiness</text>
