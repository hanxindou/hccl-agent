<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Integrity, retry, and backpressure layers</title>
  <desc id="desc">Integrity, retry, and backpressure layers. Separate host CRC, host retry, and simulated backpressure evidence. Truth: HOST_INTEGRITY_VALIDATED, HOST_RETRY_VALIDATED, SIMULATED_BACKPRESSURE. Limits: not NIC/HCCL hardware reliability. Classification: MAIN.</desc>
